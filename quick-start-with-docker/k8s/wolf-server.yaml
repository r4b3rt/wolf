---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: wolf
  name: wolf-config
data:
  # Non-secret runtime flags only. Secrets live in wolf-secrets below.
  RBAC_REDIS_URL: "redis://wolf-cache:6379/0"
  MEM_CACHE_BY_REDIS: "yes"
  CLIENT_CHANGE_PWD: "no"

---
apiVersion: v1
kind: Secret
metadata:
  namespace: wolf
  name: wolf-secrets
type: Opaque
stringData:
  # Replace these demo values before any real deployment.
  # The default password for root and admin accounts.
  RBAC_ROOT_PASSWORD: "wolf-123456"
  # KEY used to sign user tokens — generate a random value for production
  RBAC_TOKEN_KEY: "f40215a5f25cbb6d36df07629aaf1172240fe48d"
  # KEY used to encrypt application Secret and OAuth2 login user ID keys
  WOLF_CRYPT_KEY: "fbd4962351924792cb5e5b131435cd30b24e3570"
  # The database URL (contains credentials)
  RBAC_SQL_URL: "postgres://wolfroot:R0FSCY2pcuAlWhmp@wolf-database:5432/wolf"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wolf-server
  name: wolf-server
  namespace: wolf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wolf-server
  template:
    metadata:
      labels:
        app: wolf-server
    spec:
      containers:
        - name: wolf-server
          image: igeeky/wolf-server
          imagePullPolicy: Always
          ports:
            - containerPort: 12180
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: RBAC_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wolf-secrets
                  key: RBAC_ROOT_PASSWORD
            - name: RBAC_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: wolf-secrets
                  key: RBAC_TOKEN_KEY
            - name: WOLF_CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: wolf-secrets
                  key: WOLF_CRYPT_KEY
            - name: RBAC_SQL_URL
              valueFrom:
                secretKeyRef:
                  name: wolf-secrets
                  key: RBAC_SQL_URL
            - name: CLIENT_CHANGE_PWD
              valueFrom:
                configMapKeyRef:
                  name: wolf-config
                  key: CLIENT_CHANGE_PWD
            - name: RBAC_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: wolf-config
                  key: RBAC_REDIS_URL
            - name: MEM_CACHE_BY_REDIS
              valueFrom:
                configMapKeyRef:
                  name: wolf-config
                  key: MEM_CACHE_BY_REDIS
          resources:
            requests:
              cpu: 500m
              memory: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: wolf-server
  namespace: wolf
  labels:
    app: wolf-server
spec:
  ports:
    - name: http
      port: 12180
      protocol: TCP
      targetPort: 12180
  selector:
    app: wolf-server
  type: ClusterIP
